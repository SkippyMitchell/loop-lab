<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loop Lab</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d0f14;color:#e9edf5;font:16px -apple-system,system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
  header{padding:10px 4px 6px}
  #tabs{display:flex;gap:8px}
  #tabs span{flex:1;text-align:center;padding:8px 2px;font-size:14px;border-radius:10px;background:#1b2030;font-weight:600;color:#8a93a8}
  #tabs span.on{background:#2f6fed;color:#fff}
  #info{margin-top:8px;font-size:14px;color:#aab3c5;display:flex;justify-content:space-between}
  #info .rec{color:#ff5a5a;font-weight:700}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:6px 0}
  .pad{border-radius:12px;background:#1b2030;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;color:#7d869a;border:3px solid transparent;text-align:center;padding:4px;overflow:hidden}
  .pad b{font-size:17px;color:#cfd6e4}
  .pad.full{background:#1f4d4a;color:#bfe9e2}
  .pad.focus{border-color:#ffd23f}
  .pad.flash{background:#ffd23f !important;color:#000}
  .pad.recording{background:#b3261e !important}
  .grid.stage{grid-template-rows:repeat(6,1fr);gap:6px}
  .grid.kit{grid-template-rows:repeat(2,1fr)}
  .grid.surf8{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
  .pad.z0{background:#1d2440}.pad.z1{background:#2a1f3d}.pad.z2{background:#1f3326}
  .pad.z0.full{background:#2c3f86;color:#dfe6ff}.pad.z1.full{background:#5a3a86;color:#f0e3ff}.pad.z2.full{background:#2e6b45;color:#dcffe8}
  .pad.on{box-shadow:inset 0 0 0 4px #7dff9b}
  .pad.active{box-shadow:inset 0 0 0 4px #9fb4ff}
  .list{flex:1;overflow:hidden;padding:6px 0}
  .item{padding:12px;border-radius:10px;margin-bottom:6px;background:#161a25;display:flex;justify-content:space-between;border:3px solid transparent}
  .item.focus{border-color:#ffd23f;background:#222a3d}
  .item span:last-child{color:#9fb4ff}
  h2{font-size:15px;color:#aab3c5;margin:6px 2px}
  #status{min-height:40px;font-size:13px;color:#8a93a8;padding:6px 4px}
  #gl{position:fixed;inset:0;z-index:5}
  #start{position:fixed;inset:0;z-index:10;background:#0d0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:20px}
  #start button{font-size:26px;padding:22px 50px;border-radius:16px;border:0;background:#2f6fed;color:#fff;font-weight:700}
  #start p{color:#aab3c5;max-width:420px;line-height:1.4}
</style>
</head>
<body>
<div id="start">
  <h1>Loop Lab</h1>
  <p>If VoiceOver is on, double tap Start, allow microphone access, then turn VoiceOver off with your accessibility shortcut. Loop Lab speaks for itself.</p>
  <button id="startBtn">Start</button>
</div>
<div id="app" aria-hidden="true">
  <header>
    <div id="tabs"><span id="tab-stage">Stage</span><span id="tab-settings">Settings</span></div>
    <div id="info"></div>
  </header>
  <main id="main"></main>
  <div id="status"></div>
</div>
<div id="gl" aria-hidden="true"></div>
<input type="file" id="fileIn" accept="audio/*" style="display:none">

<script>
'use strict';
const $ = id => document.getElementById(id);
const ZONES = ['Kits', 'Patterns', 'Loops'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const pct = v => Math.round(v * 100) + ' percent';
const padName = i => 'Kit ' + (Math.floor(i / 8) + 1) + ' pad ' + ((i % 8) + 1);
const QUANTS = [
  {n: 'off', v: 0}, {n: 'quarter notes', v: 1}, {n: 'eighth notes', v: 0.5},
  {n: 'sixteenth notes', v: 0.25}, {n: 'thirty-second notes', v: 0.125}
];

// ---------------- state ----------------
const S = {
  tab: 'stage', focus: 0,                // focus: stage slot 0-23 (8 kits, 8 patterns, 8 loops)
  kitEd: null, kitFocus: 0, activeKit: 0,
  pads: Array(64).fill(null),          // 8 kits x 8 pads: {buf, vol, name, edits}
  clip: null, padUndo: null,
  menu: null,                           // {title, items, idx}
  idx: {settings: 0}, surface: false, surfaceKit: 0,
  bpm: 100, bpb: 4, bars: 2, metro: true, metroVol: 0.6, countIn: 1, quant: 3,
  patterns: Array.from({length: 8}, () => ({events: [], takes: [], kit: 0, bars: 2, on: false, sw: 0})),
  takeId: 0, curTake: 0, recPat: -1,
  tracks: Array(8).fill(null),          // 8 loop slots: {buf, bars, vol, muted, src, g}
  playing: false, recording: false, capturing: false,
  rate: 1.1, confirm: null, confirmT: 0, taps: [], editStep: 1, audioMode: 'playback',
  voiceEngine: 'espeak', vPitch: 50, duck: true, esVoice: '', loopOffset: null, micLoop: null, wrap: false
};
let started = false;

// ---------------- audio ----------------
let ctx, master, uiBus, speechBus;
const scheduled = [];
function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
  master = ctx.createGain(); master.connect(ctx.destination);
  uiBus = ctx.createGain(); uiBus.gain.value = 0.9; uiBus.connect(ctx.destination);
  speechBus = ctx.createGain(); speechBus.gain.value = 1; speechBus.connect(ctx.destination);
}
// Keep iOS in one steady audio mode ("playback") so speech and sounds share it
// instead of fighting. Recording switches to "play-and-record" only while you hold.
function setSession(type) { try { if (navigator.audioSession && navigator.audioSession.type !== type) navigator.audioSession.type = type; } catch (e) {} }
const AUDIO_MODES = {ambient: 'mix with speech', playback: 'playback', auto: 'automatic'};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function unlock() {
  if (!ctx) return;
  if (ctx.state !== 'running' && ctx.state !== 'closed') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
}
function resumeSoon() { unlock(); setTimeout(unlock, 300); }
// iOS can leave an audio engine silent after the microphone or speech changes the
// phone's audio setup. Rebuild a fresh engine; recorded sounds are kept.
let rebuilding = false, lastRebuild = 0;
async function rebuildAudio(quiet) {
  if (rebuilding) return; rebuilding = true; lastRebuild = performance.now();
  hushSpeech();
  const wasPlaying = S.playing;
  if (wasPlaying) stopTransport();
  try { await ctx.close(); } catch (e) {}
  initAudio();
  mic = null; proc = null;
  for (const k in liveChokes) delete liveChokes[k];
  previewVoice = null;
  unlock();
  if (wasPlaying) startTransport(0);
  rebuilding = false;
  if (!quiet) { SND.done(); speak('Audio restarted.'); }
}
// Watchdog: if the engine's clock stops moving, try to resume, then rebuild.
let wd = {last: -1, stuck: 0};
setInterval(() => {
  if (!started || !ctx || rebuilding || S.capturing || S.micLoop) return;
  const t = ctx.currentTime;
  if (ctx.state === 'running' && t === wd.last) wd.stuck++; else wd.stuck = 0;
  wd.last = t;
  if (wd.stuck >= 3 && performance.now() - lastRebuild > 20000) { wd.stuck = 0; rebuildAudio(true); }
}, 1000);

function tone(freq, dur = 0.06, vol = 0.15, when = 0, type = 'sine', dest) {
  const t = when || ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || uiBus);
  o.start(t); o.stop(t + dur + 0.03);
  return {src: o, g};
}
function silence(v) {
  if (!v) return;
  try { const now = v.g.context.currentTime; v.g.gain.cancelScheduledValues(0); v.g.gain.setValueAtTime(0, now); } catch (e) {}
}
const SND = {
  tick: () => tone(1500, 0.025, 0.06),
  edge: () => tone(170, 0.1, 0.16, 0, 'square'),
  act: () => tone(880, 0.06, 0.13),
  open: () => { tone(600, 0.05, 0.12); tone(900, 0.06, 0.12, ctx.currentTime + 0.05); },
  close: () => { tone(900, 0.05, 0.12); tone(600, 0.06, 0.12, ctx.currentTime + 0.05); },
  rec: () => tone(1000, 0.09, 0.22),
  done: () => { tone(700, 0.05, 0.14); tone(1050, 0.08, 0.14, ctx.currentTime + 0.06); },
  empty: () => tone(110, 0.08, 0.1, 0, 'triangle'),
  bank: () => { tone(500, 0.04, 0.1); tone(500, 0.04, 0.1, ctx.currentTime + 0.07); },
  wrap: () => { tone(1400, 0.04, 0.09); tone(700, 0.06, 0.09, ctx.currentTime + 0.05); }
};

// ---- pad playback with non-destructive edits ----
const EDIT_DEFAULTS = {start: 0, end: null, pitch: 0, fine: 0, rev: false, fadeIn: 0, fadeOut: 0, pan: 0, mono: false, vol: 1};
const PAD_KEYS = Object.keys(EDIT_DEFAULTS).concat('name');
function newPad(buf, name) { return Object.assign({buf, name: name || ''}, EDIT_DEFAULTS); }
const padEnd = p => p.end == null ? p.buf.duration : Math.min(p.end, p.buf.duration);
const padRate = p => Math.pow(2, ((p.pitch || 0) + (p.fine || 0) / 100) / 12);
const padLen = p => (padEnd(p) - (p.start || 0)) / padRate(p);
const isEdited = p => ['start', 'pitch', 'fine', 'fadeIn', 'fadeOut', 'pan'].some(k => p[k]) || p.rev || p.mono || p.end != null;
function revBuf(p) {
  if (!p._rev || p._revOf !== p.buf) {
    const b = p.buf, r = ctx.createBuffer(b.numberOfChannels, b.length, b.sampleRate);
    for (let c = 0; c < b.numberOfChannels; c++) {
      const s = b.getChannelData(c), d = r.getChannelData(c), n = s.length;
      for (let k = 0; k < n; k++) d[k] = s[n - 1 - k];
    }
    p._rev = r; p._revOf = b;
  }
  return p._rev;
}
// opt.head: preview just the beginning; opt.tail: preview just the ending
function makeVoice(ac, dest, i, t, chokes, opt = {}) {
  const p = S.pads[i]; if (!p) return null;
  const dur = p.buf.duration, st = clamp(p.start || 0, 0, dur), en = clamp(padEnd(p), st + 0.005, dur);
  let a = p.rev ? dur - en : st, b = p.rev ? dur - st : en;
  if (opt.head) b = Math.min(b, a + 0.4);
  if (opt.tail) a = Math.max(a, b - 0.6);
  const rate = padRate(p), real = (b - a) / rate;
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = p.rev ? revBuf(p) : p.buf;
  src.playbackRate.value = rate;
  const v = p.vol ?? 1;
  const fi = opt.tail ? 0.002 : clamp(p.fadeIn || 0, 0.002, real / 2);
  const fo = opt.head ? 0.01 : clamp(p.fadeOut || 0, 0.004, real / 2);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + fi);
  g.gain.setValueAtTime(v, t + real - fo);
  g.gain.linearRampToValueAtTime(0, t + real);
  src.connect(g);
  if (p.pan && ac.createStereoPanner) { const pn = ac.createStereoPanner(); pn.pan.value = p.pan; g.connect(pn); pn.connect(dest); }
  else g.connect(dest);
  src.start(t, a); src.stop(t + real + 0.02);
  const voice = {src, g, t};
  if (p.mono && chokes) {
    const prev = chokes[i];
    if (prev && prev.t <= t) { try { prev.g.gain.cancelScheduledValues(t); prev.g.gain.setTargetAtTime(0, t, 0.004); } catch (e) {} }
    chokes[i] = voice;
  }
  return voice;
}
const liveChokes = {};
function playPad(i, when = 0, opt) {
  const v = makeVoice(ctx, master, i, when || ctx.currentTime, liveChokes, opt);
  if (v) scheduled.push(v);
  return v;
}
let previewVoice = null;
function preview(i, opt) { silence(previewVoice); previewVoice = playPad(i, 0, opt); }

// ---------------- speech ----------------
const synth = window.speechSynthesis;
let sVoice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  sVoice = vs.find(v => v.lang === 'en-US' && /Samantha/.test(v.name)) ||
           vs.find(v => v.lang === 'en-US' && v.localService) ||
           vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function sysSpeak(text, interrupt) {
  if (!synth) return;
  if (interrupt) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.rate; u.lang = 'en-US'; if (sVoice) u.voice = sVoice;
  synth.speak(u);
}

// ---- eSpeak voice, played through Loop Lab's own sound engine ----
// Speech and sounds share one engine, so iOS can't fade one under the other.
const ES = {worker: null, ready: false, failed: false, id: 0, pending: new Map(), cache: new Map(),
  jobs: [], workerBusy: false, queue: [], busy: false, cur: null, curRes: null};
let speechGen = 0;
function initEspeak() {
  try { ES.worker = new Worker('espeak-worker.js'); } catch (e) { ES.failed = true; return; }
  ES.worker.onmessage = e => {
    const d = e.data;
    if (d.ready) { ES.ready = true; return; }
    const cb = ES.pending.get(d.id); if (cb) { ES.pending.delete(d.id); cb(d.wav); }
  };
  ES.worker.onerror = () => { ES.failed = true; ES.workerBusy = false; ES.jobs.forEach(j => j.res(null)); ES.jobs = []; };
}
initEspeak();
const useEspeak = () => S.voiceEngine === 'espeak' && ES.ready && !ES.failed && ctx;
const ES_VOICES = {'': 'default', m1: 'male 1', m2: 'male 2', m3: 'male 3', m4: 'male 4', m5: 'male 5', m6: 'male 6', m7: 'male 7',
  f1: 'female 1', f2: 'female 2', f3: 'female 3', f4: 'female 4', f5: 'female 5', klatt: 'Klatt 1', klatt2: 'Klatt 2', klatt3: 'Klatt 3',
  croak: 'croak', whisper: 'whisper', whisperf: 'whisper female'};
function esArgs() { return {speed: clamp(Math.round(175 * S.rate), 80, 450), pitch: S.vPitch, amplitude: 100, wordgap: 0,
  voice: 'en/en-us' + (ES_VOICES[S.esVoice] && S.esVoice ? '+' + S.esVoice : '')}; }
function wavToBuffer(wav) {
  const dv = new DataView(wav.buffer, wav.byteOffset, wav.byteLength);
  const sr = dv.getUint32(24, true), n = Math.floor((wav.byteLength - 44) / 2);
  if (n <= 0) return null;
  const f = new Float32Array(n);
  for (let i = 0; i < n; i++) f[i] = dv.getInt16(44 + i * 2, true) / 32768;
  let s = 0; while (s < n && Math.abs(f[s]) < 0.01) s++;
  let e = n - 1; while (e > s && Math.abs(f[e]) < 0.01) e--;
  s = Math.max(0, s - Math.floor(0.01 * sr)); e = Math.min(n, e + Math.floor(0.05 * sr));
  if (e <= s) return null;
  const b = ctx.createBuffer(1, e - s, sr); b.copyToChannel(f.subarray(s, e), 0);
  return b;
}
function genSpeech(text) {
  const key = text + '|' + S.rate + '|' + S.vPitch + '|' + S.esVoice, c = ES.cache.get(key);
  if (c) { ES.cache.delete(key); ES.cache.set(key, c); return Promise.resolve(c); }
  return new Promise(res => { ES.jobs.push({text, key, res, gen: speechGen}); runJobs(); });
}
function runJobs() {
  if (ES.workerBusy) return;
  while (ES.jobs.length && ES.jobs[0].gen !== speechGen) ES.jobs.shift().res(null);   // drop stale requests
  const j = ES.jobs.shift(); if (!j) return;
  ES.workerBusy = true;
  const id = ++ES.id;
  ES.pending.set(id, wav => {
    ES.workerBusy = false;
    let b = null; try { if (wav) b = wavToBuffer(wav); } catch (e) {}
    if (b) { ES.cache.set(j.key, b); if (ES.cache.size > 300) ES.cache.delete(ES.cache.keys().next().value); }
    j.res(b); runJobs();
  });
  ES.worker.postMessage({id, text: j.text, args: esArgs()});
}
function duck(on) {
  if (!ctx || !master) return;
  const g = on && S.duck ? 0.4 : 1;
  try { master.gain.setTargetAtTime(g, ctx.currentTime, 0.04); } catch (e) {}
}
async function pumpSpeech() {
  if (ES.busy) return; ES.busy = true;
  while (ES.queue.length) {
    const item = ES.queue.shift();
    const b = await item.p;
    if (item.gen !== speechGen || !b) continue;
    await new Promise(res => {
      if (item.gen !== speechGen) return res();
      const src = ctx.createBufferSource(); src.buffer = b; src.connect(speechBus);
      let done = false;
      const fin = () => { if (done) return; done = true; if (ES.cur === src) { ES.cur = null; ES.curRes = null; } res(); };
      src.onended = fin;
      setTimeout(fin, b.duration * 1000 + 700);   // never get stuck if iOS pauses the engine
      ES.cur = src; ES.curRes = fin; duck(true); unlock(); src.start();
    });
  }
  ES.busy = false; duck(false);
}
function hushSpeech() {
  speechGen++; ES.queue.length = 0;
  if (ES.cur) { try { ES.cur.onended = null; ES.cur.stop(); } catch (e) {} ES.cur = null; }
  if (ES.curRes) { const r = ES.curRes; ES.curRes = null; r(); }
  duck(false);
}
function speak(text, interrupt = true) {
  $('status').textContent = text;
  if (S.capturing || S.micLoop) return;          // never talk into the microphone
  if (!useEspeak()) { sysSpeak(text, interrupt); return; }
  if (interrupt) { hushSpeech(); if (synth) synth.cancel(); }
  const gen = speechGen;
  const parts = (text.match(/[^.!?]+[.!?]*/g) || [text]).map(x => x.trim()).filter(Boolean);
  for (const p of parts) ES.queue.push({p: genSpeech(p), gen});   // first sentence starts while the rest generate
  pumpSpeech();
}
function hush() { hushSpeech(); if (synth) synth.cancel(); }
function waitForVoice(ms) {
  return new Promise(res => { const t0 = performance.now(); (function chk() {
    if (ES.ready || ES.failed || performance.now() - t0 > ms) res(); else setTimeout(chk, 100); })(); });
}

// ---------------- storage (IndexedDB) ----------------
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('looplab', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  put(k, v) { if (!this.db) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} },
  del(k) { if (!this.db) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) {} },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(undefined);
      try {
        const r = this.db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result); r.onerror = () => res(undefined);
      } catch (e) { res(undefined); }
    });
  }
};
function bufToRec(buf) {
  const chs = []; for (let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c).slice());
  return {chs, sr: buf.sampleRate};
}
function recToBuf(r) {
  const chs = r.chs || [r.data];
  const b = ctx.createBuffer(chs.length, chs[0].length, r.sr);
  chs.forEach((d, c) => b.copyToChannel(d, c));
  return b;
}
function savePad(i) {
  const p = S.pads[i];
  if (!p) { DB.del('pad' + i); return; }
  const rec = bufToRec(p.buf); PAD_KEYS.forEach(k => rec[k] = p[k]);
  DB.put('pad' + i, rec);
}
function saveTracks() {
  DB.put('tracks', S.tracks.map(t => t ? Object.assign(bufToRec(t.buf), {bars: t.bars, vol: t.vol, muted: t.muted, nudge: t.nudge || 0}) : null));
}
let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const k = ['activeKit','bpm','bpb','bars','metro','metroVol','countIn','quant','takeId','rate','editStep','audioMode','voiceEngine','vPitch','duck','esVoice','loopOffset','wrap'];
    const o = {}; k.forEach(x => o[x] = S[x]);
    o.patterns = S.patterns.map(p => ({events: p.events.map(e => ({pad: e.pad, beat: e.beat, take: e.take})), takes: p.takes, kit: p.kit, bars: p.bars, on: p.on}));
    DB.put('state', o);
  }, 300);
}
async function loadAll() {
  if (!await DB.open()) return 0;
  const st = await DB.get('state');
  if (st) {
    if (st.voiceEngine === undefined) st.audioMode = 'playback';
    if (!st.patterns && st.events && st.events.length)        // older version: one pattern
      st.patterns = [{events: st.events, takes: st.takes || [], kit: 0, bars: st.bars || 2, on: false}];
    if (st.patterns) S.patterns = Array.from({length: 8}, (_, i) => Object.assign({events: [], takes: [], kit: 0, bars: S.bars, on: false}, st.patterns[i] || {}, {sw: 0}));
    delete st.patterns; delete st.events; delete st.takes; delete st.tab;
    Object.assign(S, st);
  }
  let n = 0;
  for (let i = 0; i < 64; i++) {
    const r = await DB.get('pad' + i);
    if (r) { const p = newPad(recToBuf(r), r.name); PAD_KEYS.forEach(k => { if (r[k] !== undefined) p[k] = r[k]; }); S.pads[i] = p; n++; }
  }
  const tr = await DB.get('tracks');
  if (tr) S.tracks = Array.from({length: 8}, (_, i) => { const r = tr[i]; return r ? {buf: recToBuf(r), bars: r.bars, vol: r.vol, muted: r.muted, nudge: r.nudge || 0} : null; });
  return n;
}

function surfStart(e) {

// ---------------- gestures ----------------
const G = {pts: new Map(), all: [], max: 0, t0: 0, hold: null, held: false, lastTap2: 0, tap2Timer: null, lastTap4: 0, tap4Timer: null,
  exploring: false, moved: 0, last: -1};

const gl = $('gl');
gl.addEventListener('touchstart', e => {

      if (z === 0) { const c = kitCount(n); full = c > 0; label = 'Kit ' + (n + 1); sub = c + '/8'; }
      else if (z === 1) { const p = S.patterns[n]; full = p.events.length > 0; on = full && p.on; label = 'Pattern ' + (n + 1); sub = full ? 'kit ' + (p.kit + 1) + (on ? ' · on' : ' · off') : 'empty'; }
      else { const tr = S.tracks[n]; full = !!tr; on = full && !tr.muted; label = 'Loop ' + (n + 1); sub = full ? (on ? 'on' : 'off') : 'empty'; }
      const rec = S.capturing && z === 0 && Math.floor(cap.pad / 8) === n;
      h += '<div class="pad z' + z + (full ? ' full' : '') + (on ? ' on' : '') + (z === 0 && S.activeKit === n ? ' active' : '') +
        (s === S.focus ? ' focus' : '') + (rec ? ' recording' : '') + '"><b>' + label + '</b>' + sub + '</div>';
    }
    m.innerHTML = h + '</div>';
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

// ---------------- start ----------------
$('startBtn').addEventListener('click', async () => {
  setSession(S.audioMode);
  initAudio(); unlock();
  speak('Starting Loop Lab.');
  // Ask for the microphone once so the permission prompt happens now, then close it
  // and start a fresh sound engine in normal playback mode.
  setSession('play-and-record');
  const micOK = await ensureMic();
  closeMic();
  await afterMic();
  const n = await loadAll();
  setSession(S.audioMode);
  await waitForVoice(4000);
  $('start').remove(); started = true; render();
  speak('Loop Lab ready. If VoiceOver is on, turn it off now. ' + (n ? n + ' pads loaded. ' : '') +
    (micOK ? '' : 'Microphone is not available, so use Load from Files or demo sounds in a kit menu. ') +
    'Stage. Kits on top, patterns in the middle, loops at the bottom. ' + slotDesc(S.focus) + '. Four-finger tap for help.');
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.capturing) stopPadRecord(); });
</script>
