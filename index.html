<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loop Lab</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d0f14;color:#e9edf5;font:16px -apple-system,system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
  header{padding:10px 4px 6px}
  #tabs{display:flex;gap:8px}
  #tabs span{flex:1;text-align:center;padding:8px;border-radius:10px;background:#1b2030;font-weight:600;color:#8a93a8}
  #tabs span.on{background:#2f6fed;color:#fff}
  #info{margin-top:8px;font-size:14px;color:#aab3c5;display:flex;justify-content:space-between}
  #info .rec{color:#ff5a5a;font-weight:700}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:6px 0}
  .pad{border-radius:12px;background:#1b2030;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;color:#7d869a;border:3px solid transparent;text-align:center;padding:4px;overflow:hidden}
  .pad b{font-size:17px;color:#cfd6e4}
  .pad.full{background:#1f4d4a;color:#bfe9e2}
  .pad.focus{border-color:#ffd23f}
  .pad.flash{background:#ffd23f !important;color:#000}
  .pad.recording{background:#b3261e !important}
  .list{flex:1;overflow:hidden;padding:6px 0}
  .item{padding:12px;border-radius:10px;margin-bottom:6px;background:#161a25;display:flex;justify-content:space-between;border:3px solid transparent}
  .item.focus{border-color:#ffd23f;background:#222a3d}
  .item span:last-child{color:#9fb4ff}
  h2{font-size:15px;color:#aab3c5;margin:6px 2px}
  #status{min-height:40px;font-size:13px;color:#8a93a8;padding:6px 4px}
  #gl{position:fixed;inset:0;z-index:5}
  #start{position:fixed;inset:0;z-index:10;background:#0d0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:20px}
  #start button{font-size:26px;padding:22px 50px;border-radius:16px;border:0;background:#2f6fed;color:#fff;font-weight:700}
  #start p{color:#aab3c5;max-width:420px;line-height:1.4}
</style>
</head>
<body>
<div id="start">
  <h1>Loop Lab</h1>
  <p>If VoiceOver is on, double tap Start, allow microphone access, then turn VoiceOver off with your accessibility shortcut. Loop Lab speaks for itself.</p>
  <button id="startBtn">Start</button>
</div>
<div id="app" aria-hidden="true">
  <header>
    <div id="tabs"><span id="tSample">Sample</span><span id="tSeq">Sequence</span></div>
    <div id="info"></div>
  </header>
  <main id="main"></main>
  <div id="status"></div>
</div>
<div id="gl" aria-hidden="true"></div>
<input type="file" id="fileIn" accept="audio/*" style="display:none">

<script>
'use strict';
const $ = id => document.getElementById(id);
const BANKS = 'ABCD';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const pct = v => Math.round(v * 100) + ' percent';
const padName = i => BANKS[Math.floor(i / 16)] + ((i % 16) + 1);
const QUANTS = [
  {n: 'off', v: 0}, {n: 'quarter notes', v: 1}, {n: 'eighth notes', v: 0.5},
  {n: 'sixteenth notes', v: 0.25}, {n: 'thirty-second notes', v: 0.125}
];

// ---------------- state ----------------
const S = {
  tab: 'sample', bank: 0, focus: 0,
  pads: Array(64).fill(null),          // {buf, vol, name}
  clip: null, padUndo: null,
  menu: null,                           // {title, items, idx}
  seqIdx: 0, surface: false, surfaceBank: 0,
  bpm: 100, bpb: 4, bars: 2, metro: true, metroVol: 0.6, countIn: 1, quant: 3,
  events: [], takes: [], takeId: 0, curTake: 0,
  tracks: [],                           // {buf, bars, vol, muted, src, g}
  playing: false, recording: false, capturing: false,
  rate: 1.1, confirm: null, confirmT: 0, taps: [], editStep: 1
};
let started = false;

// ---------------- audio ----------------
let ctx, master, uiBus;
const scheduled = [];
function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
  master = ctx.createGain(); master.connect(ctx.destination);
  uiBus = ctx.createGain(); uiBus.gain.value = 0.9; uiBus.connect(ctx.destination);
  ctx.onstatechange = () => { if (ctx.state !== 'running' && ctx.state !== 'closed') resumeSoon(); };
}
function unlock() {
  if (!ctx) return;
  if (ctx.state !== 'running' && ctx.state !== 'closed') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
}
function resumeSoon() { unlock(); setTimeout(unlock, 300); }
// iOS can leave an audio engine silent after the microphone or speech changes the
// phone's audio setup. Rebuild a fresh engine; recorded sounds are kept.
let rebuilding = false;
async function rebuildAudio(quiet) {
  if (rebuilding) return; rebuilding = true;
  const wasPlaying = S.playing;
  if (wasPlaying) stopTransport();
  try { await ctx.close(); } catch (e) {}
  initAudio();
  mic = null; proc = null;
  if (micStream && micLive()) connectMic(); else if (micStream) await ensureMic(true);
  for (const k in liveChokes) delete liveChokes[k];
  previewVoice = null;
  unlock();
  if (wasPlaying) startTransport(0);
  rebuilding = false;
  if (!quiet) { SND.done(); speak('Audio restarted.'); }
}
// Watchdog: if the engine's clock stops moving, try to resume, then rebuild.
let wd = {last: -1, stuck: 0};
setInterval(() => {
  if (!started || !ctx || rebuilding || S.capturing) return;
  const t = ctx.currentTime;
  if (ctx.state === 'running' && t === wd.last) wd.stuck++; else { wd.stuck = 0; if (ctx.state !== 'running') unlock(); }
  wd.last = t;
  if (wd.stuck >= 3) { wd.stuck = 0; rebuildAudio(true); }
}, 1000);

function tone(freq, dur = 0.06, vol = 0.15, when = 0, type = 'sine', dest) {
  const t = when || ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || uiBus);
  o.start(t); o.stop(t + dur + 0.03);
  return {src: o, g};
}
function silence(v) {
  if (!v) return;
  try { const now = v.g.context.currentTime; v.g.gain.cancelScheduledValues(0); v.g.gain.setValueAtTime(0, now); } catch (e) {}
}
const SND = {
  tick: () => tone(1500, 0.025, 0.06),
  edge: () => tone(170, 0.1, 0.16, 0, 'square'),
  act: () => tone(880, 0.06, 0.13),
  open: () => { tone(600, 0.05, 0.12); tone(900, 0.06, 0.12, ctx.currentTime + 0.05); },
  close: () => { tone(900, 0.05, 0.12); tone(600, 0.06, 0.12, ctx.currentTime + 0.05); },
  rec: () => tone(1000, 0.09, 0.22),
  done: () => { tone(700, 0.05, 0.14); tone(1050, 0.08, 0.14, ctx.currentTime + 0.06); },
  empty: () => tone(110, 0.08, 0.1, 0, 'triangle'),
  bank: () => { tone(500, 0.04, 0.1); tone(500, 0.04, 0.1, ctx.currentTime + 0.07); }
};

// ---- pad playback with non-destructive edits ----
const EDIT_DEFAULTS = {start: 0, end: null, pitch: 0, fine: 0, rev: false, fadeIn: 0, fadeOut: 0, pan: 0, mono: false, vol: 1};
const PAD_KEYS = Object.keys(EDIT_DEFAULTS).concat('name');
function newPad(buf, name) { return Object.assign({buf, name: name || ''}, EDIT_DEFAULTS); }
const padEnd = p => p.end == null ? p.buf.duration : Math.min(p.end, p.buf.duration);
const padRate = p => Math.pow(2, ((p.pitch || 0) + (p.fine || 0) / 100) / 12);
const padLen = p => (padEnd(p) - (p.start || 0)) / padRate(p);
const isEdited = p => ['start', 'pitch', 'fine', 'fadeIn', 'fadeOut', 'pan'].some(k => p[k]) || p.rev || p.mono || p.end != null;
function revBuf(p) {
  if (!p._rev || p._revOf !== p.buf) {
    const b = p.buf, r = ctx.createBuffer(b.numberOfChannels, b.length, b.sampleRate);
    for (let c = 0; c < b.numberOfChannels; c++) {
      const s = b.getChannelData(c), d = r.getChannelData(c), n = s.length;
      for (let k = 0; k < n; k++) d[k] = s[n - 1 - k];
    }
    p._rev = r; p._revOf = b;
  }
  return p._rev;
}
// opt.head: preview just the beginning; opt.tail: preview just the ending
function makeVoice(ac, dest, i, t, chokes, opt = {}) {
  const p = S.pads[i]; if (!p) return null;
  const dur = p.buf.duration, st = clamp(p.start || 0, 0, dur), en = clamp(padEnd(p), st + 0.005, dur);
  let a = p.rev ? dur - en : st, b = p.rev ? dur - st : en;
  if (opt.head) b = Math.min(b, a + 0.4);
  if (opt.tail) a = Math.max(a, b - 0.6);
  const rate = padRate(p), real = (b - a) / rate;
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = p.rev ? revBuf(p) : p.buf;
  src.playbackRate.value = rate;
  const v = p.vol ?? 1;
  const fi = opt.tail ? 0.002 : clamp(p.fadeIn || 0, 0.002, real / 2);
  const fo = opt.head ? 0.01 : clamp(p.fadeOut || 0, 0.004, real / 2);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + fi);
  g.gain.setValueAtTime(v, t + real - fo);
  g.gain.linearRampToValueAtTime(0, t + real);
  src.connect(g);
  if (p.pan && ac.createStereoPanner) { const pn = ac.createStereoPanner(); pn.pan.value = p.pan; g.connect(pn); pn.connect(dest); }
  else g.connect(dest);
  src.start(t, a); src.stop(t + real + 0.02);
  const voice = {src, g, t};
  if (p.mono && chokes) {
    const prev = chokes[i];
    if (prev && prev.t <= t) { try { prev.g.gain.cancelScheduledValues(t); prev.g.gain.setTargetAtTime(0, t, 0.004); } catch (e) {} }
    chokes[i] = voice;
  }
  return voice;
}
const liveChokes = {};
function playPad(i, when = 0, opt) {
  const v = makeVoice(ctx, master, i, when || ctx.currentTime, liveChokes, opt);
  if (v) scheduled.push(v);
  return v;
}
let previewVoice = null;
function preview(i, opt) { silence(previewVoice); previewVoice = playPad(i, 0, opt); }

// ---------------- speech ----------------
const synth = window.speechSynthesis;
let sVoice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  sVoice = vs.find(v => v.lang === 'en-US' && /Samantha/.test(v.name)) ||
           vs.find(v => v.lang === 'en-US' && v.localService) ||
           vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(text, interrupt = true) {
  $('status').textContent = text;
  if (!synth || S.capturing) return;
  if (interrupt) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.rate; u.lang = 'en-US'; if (sVoice) u.voice = sVoice;
  synth.speak(u);
}
function hush() { if (synth) synth.cancel(); }

// ---------------- storage (IndexedDB) ----------------
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('looplab', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  put(k, v) { if (!this.db) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} },
  del(k) { if (!this.db) return; try { this.db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) {} },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(undefined);
      try {
        const r = this.db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result); r.onerror = () => res(undefined);
      } catch (e) { res(undefined); }
    });
  }
};
function bufToRec(buf) {
  const chs = []; for (let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c).slice());
  return {chs, sr: buf.sampleRate};
}
function recToBuf(r) {
  const chs = r.chs || [r.data];
  const b = ctx.createBuffer(chs.length, chs[0].length, r.sr);
  chs.forEach((d, c) => b.copyToChannel(d, c));
  return b;
}
function savePad(i) {
  const p = S.pads[i];
  if (!p) { DB.del('pad' + i); return; }
  const rec = bufToRec(p.buf); PAD_KEYS.forEach(k => rec[k] = p[k]);
  DB.put('pad' + i, rec);
}
function saveTracks() {
  DB.put('tracks', S.tracks.map(t => Object.assign(bufToRec(t.buf), {bars: t.bars, vol: t.vol, muted: t.muted})));
}
let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const k = ['bank','surfaceBank','bpm','bpb','bars','metro','metroVol','countIn','quant','events','takes','takeId','rate','editStep'];
    const o = {}; k.forEach(x => o[x] = S[x]);
    DB.put('state', o);
  }, 300);
}
async function loadAll() {
  if (!await DB.open()) return 0;
  const st = await DB.get('state');
  if (st) Object.assign(S, st);
  let n = 0;
  for (let i = 0; i < 64; i++) {
    const r = await DB.get('pad' + i);
    if (r) { const p = newPad(recToBuf(r), r.name); PAD_KEYS.forEach(k => { if (r[k] !== undefined) p[k] = r[k]; }); S.pads[i] = p; n++; }
  }
  const tr = await DB.get('tracks');
  if (tr) S.tracks = tr.map(r => ({buf: recToBuf(r), bars: r.bars, vol: r.vol, muted: r.muted}));
  return n;
}

// ---------------- microphone + pad recording ----------------
// Two capture paths run together: raw samples from the Web Audio graph, and a
// MediaRecorder copy. If iOS feeds the graph silence, the MediaRecorder copy is used.
let mic = null, micStream = null, proc = null;
const cap = {on: false, chunks: [], timer: null, pad: -1, rec: null, blobs: [], busy: false};
const micLive = () => micStream && micStream.getAudioTracks().some(t => t.readyState === 'live' && t.enabled);
async function ensureMic(force) {
  if (mic && micLive() && !force) return true;
  try {
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    connectMic();
    return true;
  } catch (e) { mic = null; micStream = null; return false; }
}
function connectMic() {
  if (mic) try { mic.disconnect(); } catch (e) {}
  mic = ctx.createMediaStreamSource(micStream);
  if (!proc) {
    proc = ctx.createScriptProcessor(2048, 1, 1);
    proc.onaudioprocess = e => { if (cap.on) cap.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    const z = ctx.createGain(); z.gain.value = 0;
    proc.connect(z); z.connect(ctx.destination);
  }
  mic.connect(proc);
}
async function startPadRecord() {
  if (cap.busy) return;
  const i = S.bank * 16 + S.focus;
  if (!mic || !micLive()) {
    const ok = await ensureMic(true);
    if (!ok) { speak('Microphone is not available. Check that Safari is allowed to use the microphone, or load a sound from Files in the pad menu.'); return; }
    if (!G.held && !spaceDown) { speak('Microphone reconnected. Hold again to record.'); return; }
  }
  unlock();
  hush();
  S.capturing = true; cap.pad = i; cap.chunks = []; cap.blobs = []; cap.rec = null;
  SND.rec();
  setTimeout(() => {
    if (!S.capturing) return;
    cap.chunks = []; cap.on = true;
    if (window.MediaRecorder) {
      try {
        const mr = new MediaRecorder(micStream);
        mr.ondataavailable = e => { if (e.data && e.data.size) cap.blobs.push(e.data); };
        mr.start(); cap.rec = mr;
      } catch (e) { cap.rec = null; }
    }
  }, 150);
  cap.timer = setTimeout(() => { if (S.capturing) { G.held = false; stopPadRecord(); } }, 20000);
  render();
}
function stopRecorder() {
  return new Promise(res => {
    const mr = cap.rec; if (!mr || mr.state === 'inactive') return res();
    mr.onstop = () => res(); setTimeout(res, 1500);
    try { mr.stop(); } catch (e) { res(); }
  });
}
async function decodeBlobs() {
  if (!cap.blobs.length) return null;
  try {
    const ab = await new Blob(cap.blobs, {type: cap.blobs[0].type}).arrayBuffer();
    const dec = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
    const n = dec.length, out = new Float32Array(n);
    for (let c = 0; c < dec.numberOfChannels; c++) { const d = dec.getChannelData(c); for (let k = 0; k < n; k++) out[k] += d[k] / dec.numberOfChannels; }
    return {raw: out, sr: dec.sampleRate};
  } catch (e) { return null; }
}
const peakOf = (a, n) => { let p = 0; for (let k = 0; k < n; k++) { const v = Math.abs(a[k]); if (v > p) p = v; } return p; };
async function stopPadRecord() {
  if (!S.capturing) return;
  clearTimeout(cap.timer);
  cap.on = false; S.capturing = false; cap.busy = true;
  await stopRecorder();
  const i = cap.pad;
  let sr = ctx.sampleRate, via = 'direct';
  let len = cap.chunks.reduce((a, c) => a + c.length, 0);
  let raw = new Float32Array(len); let o = 0;
  for (const c of cap.chunks) { raw.set(c, o); o += c.length; }
  let peak = peakOf(raw, len);
  if (peak < 0.003) {                                         // graph gave silence: try the MediaRecorder copy
    const alt = await decodeBlobs();
    if (alt) { const p2 = peakOf(alt.raw, alt.raw.length); if (p2 > peak) { raw = alt.raw; sr = alt.sr; len = raw.length; peak = p2; via = 'recorder'; } }
  }
  cap.busy = false;
  len = Math.max(0, len - Math.floor(0.05 * sr));             // drop finger-lift noise
  peak = peakOf(raw, len);
  if (len < 0.1 * sr) {
    SND.empty(); render();
    speak(padName(i) + ' unchanged. Too short. After the beep, keep holding while you make your sound.');
    return;
  }
  if (peak < 0.003) {
    SND.empty(); render();
    const tr = micStream && micStream.getAudioTracks()[0];
    const st = !tr ? 'no microphone track' : tr.readyState !== 'live' ? 'microphone track ended' : tr.muted ? 'microphone muted by the system' : 'microphone on';
    speak(padName(i) + ' unchanged. No sound was heard. Captured ' + (len / sr).toFixed(1) + ' seconds, loudest level ' +
      (peak * 100).toFixed(2) + ' percent, ' + st + ', audio ' + ctx.state + '. Reconnecting the microphone, try again.');
    ensureMic(true);
    return;
  }
  const on = Math.max(0.002, peak * 0.08), off = Math.max(0.001, peak * 0.02);
  let s = 0; while (s < len && Math.abs(raw[s]) < on) s++;
  s = Math.max(0, s - Math.floor(0.005 * sr));
  let e = len - 1; while (e > s && Math.abs(raw[e]) < off) e--;
  e = Math.min(len, e + Math.floor(0.03 * sr));
  const n = Math.max(1, e - s), gain = Math.min(0.9 / peak, 30);
  const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  const fi = Math.floor(0.003 * sr), fo = Math.floor(0.01 * sr);
  for (let k = 0; k < n; k++) {
    let v = raw[s + k] * gain;
    if (k < fi) v *= k / fi;
    if (k > n - fo) v *= (n - k) / fo;
    d[k] = v;
  }
  S.padUndo = {i, prev: S.pads[i]};
  S.pads[i] = newPad(buf);
  savePad(i); SND.done(); render();
  speak(padName(i) + ' recorded, ' + buf.duration.toFixed(1) + ' seconds.' + (via === 'recorder' ? ' Used backup recorder.' : ''));
}

// ---------------- demo kit ----------------
const DEMO = [['Kick','kick'],['Snare','snare'],['Closed hat','hat'],['Open hat','ohat'],['Clap','clap'],['Rim','rim'],
  ['Low tom','tomL'],['High tom','tomH'],['Cowbell','cow'],['Shaker','shaker'],['Bass C','b65.41'],['Bass E flat','b77.78'],
  ['Bass F','b87.31'],['Bass G','b98'],['Chord stab','stab'],['Blip','blip']];
function gen(kind, sr) {
  const N = s => Math.floor(s * sr), nz = () => Math.random() * 2 - 1;
  let len = N(0.5), d, ph = 0, prev = 0;
  const mk = l => { len = N(l); d = new Float32Array(len); };
  if (kind[0] === 'b' && kind !== 'blip') {
    const f = parseFloat(kind.slice(1)); mk(0.6);
    for (let i = 0; i < len; i++) { const t = i / sr; ph += 2 * Math.PI * f / sr;
      d[i] = (Math.sin(ph) + 0.35 * Math.sin(2 * ph) + 0.15 * Math.sin(3 * ph)) * Math.exp(-t * 4) * Math.min(1, t / 0.005); }
  } else switch (kind) {
    case 'kick': mk(0.5); for (let i = 0; i < len; i++) { const t = i / sr; ph += 2 * Math.PI * (45 + 110 * Math.exp(-t * 25)) / sr; d[i] = Math.sin(ph) * Math.exp(-t * 7); } break;
    case 'snare': mk(0.3); for (let i = 0; i < len; i++) { const t = i / sr; d[i] = nz() * 0.7 * Math.exp(-t * 18) + Math.sin(2 * Math.PI * 190 * t) * 0.5 * Math.exp(-t * 30); } break;
    case 'hat': case 'ohat': case 'shaker': mk(kind === 'hat' ? 0.08 : kind === 'ohat' ? 0.45 : 0.15);
      for (let i = 0; i < len; i++) { const t = i / sr, n = nz(), h = n - prev; prev = n;

$('fileIn').addEventListener('change', async e => {

  try {

    {l: () => 'Undo last take', v: () => S.takes.length ? S.takes.length + (S.takes.length === 1 ? ' take' : ' takes') : 'nothing to undo', a: () => { undoTake(); return 'quiet'; }},
    {l: () => 'Clear pattern', v: () => S.events.length + (S.events.length === 1 ? ' hit' : ' hits'), a: confirmThen('clearPat', clearPattern)},
    {l: () => 'Bounce pattern to loop track', a: () => { bounce(); return 'quiet'; },
      h: 'Turns the pattern into an audio loop track, then clears the pattern so you can record the next layer. Up to 8 tracks. Tempo locks while tracks exist.'},
    {l: () => 'Restart audio', a: () => { rebuildAudio(false); return 'quiet'; },
      h: 'Use this if sounds stop. It restarts the sound engine and keeps all your recordings.'}
  ];
  S.tracks.forEach((tr, ti) => it.push({
    l: () => 'Loop track ' + (ti + 1), v: () => tr.bars + (tr.bars === 1 ? ' bar' : ' bars') + ', ' + (tr.muted ? 'muted' : 'on') + ', volume ' + pct(tr.vol),
    a: () => { tr.muted = !tr.muted; trackGain(tr); saveTracks(); }, adj: d => { tr.vol = clamp(round1(tr.vol + d * 0.1), 0, 1.5); trackGain(tr); saveTracks(); },
    menu: () => trackMenu(ti), h: 'Tap to mute or unmute. Swipe left or right for volume. Two-finger tap for more, including delete.'
  }));
  return it;
}
function curList() {
  if (S.menu) return {items: S.menu.items, get: () => S.menu.idx, set: v => S.menu.idx = v};
  if (S.tab === 'sequence') return {items: seqItems(), get: () => S.seqIdx, set: v => S.seqIdx = v};
  return null;
}

// ---------------- actions ----------------
function gridMove(dir) {
  const r = Math.floor(S.focus / 4), c = S.focus % 4;
  let nr = r, nc = c;
  if (dir === 'up') nr--; if (dir === 'down') nr++; if (dir === 'left') nc--; if (dir === 'right') nc++;
  if (nr < 0 || nr > 3 || nc < 0 || nc > 3) { SND.edge(); return; }
  S.focus = nr * 4 + nc; SND.tick(); render();
  speak(padDesc(S.bank * 16 + S.focus));
}
function listMove(dir) {
  const L = curList(); if (!L) return;
  const it = L.items[L.get()];
  if (dir === 'up' || dir === 'down') {
    const n = L.get() + (dir === 'down' ? 1 : -1);
    if (n < 0 || n >= L.items.length) { SND.edge(); return; }
    L.set(n); SND.tick(); render(); speak(itemText(L.items[n]));
  } else {
    if (!it.adj) { SND.edge(); return; }
    it.adj(dir === 'right' ? 1 : -1); SND.tick(); saveState(); render();
    speak(it.v ? it.v() : it.l());
  }
}
function activate() {
  if (S.tab === 'sample' && !S.menu) {
    const i = S.bank * 16 + S.focus;
    if (!playPad(i)) { SND.empty(); speak(padName(i) + ', empty. Touch and hold to record.'); }
    return;
  }
  const L = curList(), it = L.items[L.get()];
  if (!it.a) { SND.edge(); speak(itemText(it)); return; }
  if (it !== undefined && it.l() !== 'Tempo') SND.act();
  const res = it.a();
  saveState(); render();
  if (res !== 'quiet') speak(itemText(curList().items[curList().get()]));
}
function openMenu() {
  if (S.menu) { activate(); return; }
  if (S.tab === 'sample') { S.menu = padMenu(S.bank * 16 + S.focus); }
  else { const it = seqItems()[S.seqIdx]; if (it.menu) S.menu = it.menu(); else { activate(); return; } }
  SND.open(); render();
  speak(S.menu.title + '. ' + itemText(S.menu.items[0]) + ', 1 of ' + S.menu.items.length);
}
function back() {
  if (S.menu && S.menu.parent) {
    S.menu = S.menu.parent; SND.close(); render();
    speak(S.menu.title + '. ' + itemText(S.menu.items[S.menu.idx]));
  } else if (S.menu) {
    S.menu = null; SND.close(); render();
    speak(S.tab === 'sample' ? padDesc(S.bank * 16 + S.focus) : itemText(seqItems()[S.seqIdx]));
  } else SND.edge();
}
function changeBank(d) {
  const n = S.bank + d; if (n < 0 || n > 3) { SND.edge(); return; }
  S.bank = n; SND.bank(); saveState(); render();
  const full = S.pads.slice(n * 16, n * 16 + 16).filter(Boolean).length;
  speak('Bank ' + BANKS[n] + ', ' + full + ' of 16 recorded. ' + padDesc(n * 16 + S.focus));
}
function switchTab(d) {
  const tabs = ['sample', 'sequence'], n = tabs.indexOf(S.tab) + d;
  if (n < 0 || n >= tabs.length) { SND.edge(); return; }
  S.tab = tabs[n]; S.menu = null; SND.bank(); render();
  if (S.tab === 'sample') speak('Sample tab, bank ' + BANKS[S.bank] + '. ' + padDesc(S.bank * 16 + S.focus));
  else speak('Sequence tab. ' + itemText(seqItems()[S.seqIdx]));
}
function whereAmI() {
  const loop = S.playing ? 'Loop playing.' : 'Loop stopped.';
  if (S.menu) speak(S.menu.title + '. ' + itemText(S.menu.items[S.menu.idx]) + ', ' + (S.menu.idx + 1) + ' of ' + S.menu.items.length + '. ' + loop);
  else if (S.tab === 'sample') { const full = S.pads.slice(S.bank * 16, S.bank * 16 + 16).filter(Boolean).length;
    speak('Sample tab, bank ' + BANKS[S.bank] + ', ' + full + ' of 16 recorded. ' + loop); }
  else speak('Sequence tab. ' + S.bpm + ' BPM, ' + S.bars + ' bars of ' + S.bpb + '. ' + loop + ' Pattern has ' + S.events.length + ' hits, ' + S.tracks.length + ' loop tracks.');
}
function rateChange(d) { S.rate = clamp(round1(S.rate + d * 0.1), 0.5, 2); saveState(); speak('Speech rate ' + Math.round(S.rate * 100) + ' percent'); }
function help() {
  let t;
  if (S.menu) t = 'Menu. Swipe up or down to move. Swipe left or right to change a value. Tap to choose. Touch and hold to hear a description. Two-finger swipe down closes the menu.';
  else if (S.tab === 'sample') t = 'Sample tab. Swipe in any direction to move between the 16 pads. Tap plays the focused pad. Touch and hold to record: wait for the beep, make your sound, then lift. Two-finger tap opens the pad menu. Two-finger swipe left or right changes bank.';
  else t = 'Sequence tab. Swipe up or down to move through controls. Swipe left or right to change a setting. Tap to activate. Touch and hold to hear a description. Two-finger tap on a loop track opens its menu.';
  t += ' Everywhere: three-finger tap plays or stops the loop. Three-finger swipe left or right changes tab. Three-finger swipe up or down changes speech rate. Two-finger swipe up says where you are. Two-finger double tap stops speech. Four-finger tap is help.';
  speak(t);
}

// ---------------- gestures ----------------
const G = {pts: new Map(), all: [], max: 0, t0: 0, hold: null, held: false, lastTap2: 0, tap2Timer: null};
function holdFire() {
  G.held = true;
  if (S.tab === 'sample' && !S.menu) startPadRecord();
  else { const L = curList(); const it = L && L.items[L.get()]; if (it) speak(it.h || itemText(it)); }
}
function holdEnd() { if (S.capturing) stopPadRecord(); }
function classify() {
  const dur = performance.now() - G.t0, n = G.max;
  let dx = 0, dy = 0; for (const p of G.all) { dx += p.x - p.x0; dy += p.y - p.y0; }
  dx /= G.all.length; dy /= G.all.length;
  const d = Math.hypot(dx, dy);
  if (d > 40 && dur < 900) {
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    onSwipe(n, dir);
  } else if (d < 30 && dur < 400) {
    if (n === 2) {
      const now = performance.now();
      if (now - G.lastTap2 < 350) { clearTimeout(G.tap2Timer); G.lastTap2 = 0; hush(); }
      else { G.lastTap2 = now; G.tap2Timer = setTimeout(() => openMenu(), 300); }
    } else onTap(n);
  }
}
function onSwipe(n, dir) {
  if (n === 1) { if (S.tab === 'sample' && !S.menu) gridMove(dir); else listMove(dir); }
  else if (n === 2) {
    if (dir === 'down') back();
    else if (dir === 'up') whereAmI();
    else if (S.tab === 'sample' && !S.menu) changeBank(dir === 'right' ? 1 : -1);
    else SND.edge();
  } else if (n === 3) {
    if (dir === 'left' || dir === 'right') switchTab(dir === 'right' ? 1 : -1);
    else rateChange(dir === 'up' ? 1 : -1);
  }
}
function onTap(n) {
  if (n === 1) activate();
  else if (n === 3) togglePlay();
  else if (n >= 4) help();
}
const gl = $('gl');
gl.addEventListener('touchstart', e => {
  e.preventDefault(); if (!started) return; unlock();
  if (S.surface) { surfStart(e); return; }
  if (G.pts.size === 0) { G.all = []; G.max = 0; G.held = false; G.t0 = performance.now(); clearTimeout(G.hold); G.hold = setTimeout(holdFire, 450); }
  for (const t of e.changedTouches) { const p = {x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY}; G.pts.set(t.identifier, p); G.all.push(p); }
  G.max = Math.max(G.max, G.pts.size);
  if (G.max > 1) clearTimeout(G.hold);
}, {passive: false});
gl.addEventListener('touchmove', e => {
  e.preventDefault(); if (S.surface) return;
  for (const t of e.changedTouches) {
    const p = G.pts.get(t.identifier); if (!p) continue;
    p.x = t.clientX; p.y = t.clientY;
    if (!G.held && Math.hypot(p.x - p.x0, p.y - p.y0) > 15) clearTimeout(G.hold);
  }
}, {passive: false});
function tEnd(e) {
  e.preventDefault(); if (!started) return;
  if (S.surface) { surfEnd(e); return; }
  for (const t of e.changedTouches) G.pts.delete(t.identifier);
  if (G.pts.size) return;
  clearTimeout(G.hold);
  if (G.held) { G.held = false; holdEnd(); return; }
  if (G.all.length) classify();
}
gl.addEventListener('touchend', e => { unlock(); tEnd(e); }, {passive: false});
gl.addEventListener('touchcancel', tEnd, {passive: false});

// keyboard (for testing on a laptop)
const SURF_KEYS = '1234qwerasdfzxcv';
let spaceDown = false;
document.addEventListener('keydown', e => {
  if (!started || e.repeat && e.key !== ' ') return;
  unlock();
  if (S.surface) {
    const k = SURF_KEYS.indexOf(e.key.toLowerCase());
    if (k >= 0) { const fake = {changedTouches: [{identifier: 'k' + k, clientX: (k % 4 + 0.5) * innerWidth / 4, clientY: (Math.floor(k / 4) + 0.5) * innerHeight / 4}]}; surfStart(fake); SG.active.delete('k' + k); }
    if (e.key === 'Escape') exitSurface();
    e.preventDefault(); return;
  }
  const arrows = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'};
  if (arrows[e.key]) { e.shiftKey ? onSwipe(3, arrows[e.key]) : onSwipe(1, arrows[e.key]); }
  else if (e.key === 'Enter') onTap(1);
  else if (e.key === ' ') { if (!spaceDown) { spaceDown = true; holdFire(); } }
  else if (e.key === 'Escape') back();
  else if (e.key === 'm') openMenu();
  else if (e.key === '[' || e.key === ']') onSwipe(2, e.key === ']' ? 'right' : 'left');
  else if (e.key === 'p') togglePlay();
  else if (e.key === 'h') help();
  else if (e.key === 'w') whereAmI();
  else return;
  e.preventDefault();
});
document.addEventListener('keyup', e => { if (e.key === ' ' && spaceDown) { spaceDown = false; G.held = false; holdEnd(); } });

// ---------------- rendering (visual, for sighted collaborators) ----------------
function render() {
  $('tSample').className = S.tab === 'sample' ? 'on' : '';
  $('tSeq').className = S.tab === 'sequence' ? 'on' : '';
  const left = S.surface ? 'Play surface, bank ' + BANKS[S.surfaceBank] : S.tab === 'sample' ? 'Bank ' + BANKS[S.bank] : S.bpm + ' BPM, ' + S.bars + ' bars of ' + S.bpb;
  const right = S.capturing ? '<span class="rec">● Recording pad</span>' : S.recording ? '<span class="rec">● Recording</span>' : S.playing ? '▶ Playing' : '■ Stopped';
  $('info').innerHTML = '<span>' + left + '</span><span>' + right + '</span>';
  const m = $('main');
  if (S.surface) {
    let h = '<div class="grid">';
    for (let k = 0; k < 16; k++) { const i = S.surfaceBank * 16 + k, p = S.pads[i];
      h += '<div class="pad' + (p ? ' full' : '') + '" data-k="' + k + '"><b>' + padName(i) + '</b>' + (p ? esc(p.name || 'rec') : '') + '</div>'; }
    m.innerHTML = h + '</div>';
  } else if (S.menu || S.tab === 'sequence') {
    const L = curList(); const idx = L.get();
    const start = Math.max(0, Math.min(idx - 4, L.items.length - 10));
    let h = '<div class="list">' + (S.menu ? '<h2>' + esc(S.menu.title) + '</h2>' : '');
    L.items.slice(start, start + 10).forEach((it, j) => {
      h += '<div class="item' + (start + j === idx ? ' focus' : '') + '"><span>' + esc(it.l()) + '</span><span>' + esc(it.v ? it.v() : '') + '</span></div>'; });
    m.innerHTML = h + '</div>';
  } else {
    let h = '<div class="grid">';
    for (let k = 0; k < 16; k++) { const i = S.bank * 16 + k, p = S.pads[i];
      h += '<div class="pad' + (p ? ' full' : '') + (k === S.focus ? ' focus' : '') + (S.capturing && cap.pad === i ? ' recording' : '') + '"><b>' + padName(i) + '</b>' +
        (p ? esc(p.name || 'rec') + ' ' + p.buf.duration.toFixed(1) + 's' : 'empty') + '</div>'; }
    m.innerHTML = h + '</div>';
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

// ---------------- start ----------------
$('startBtn').addEventListener('click', async () => {
  initAudio(); unlock();
  speak('Starting Loop Lab.');
  await ensureMic();
  // Turning the microphone on changes the phone's audio setup, which can silence an
  // engine made before it. Start a fresh engine now that the mic is on.
  if (mic) await rebuildAudio(true);
  const n = await loadAll();
  $('start').remove(); started = true; render();
  speak('Loop Lab ready. If VoiceOver is on, turn it off now. ' + (n ? n + ' pads loaded. ' : '') +
    (mic ? '' : 'Microphone is not available, so use Load from Files or demo sounds in the pad menu. ') +
    'Sample tab, bank ' + BANKS[S.bank] + '. ' + padDesc(S.bank * 16 + S.focus) + '. Four-finger tap for help.');
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.capturing) stopPadRecord(); });
</script>
</body>
</html>
